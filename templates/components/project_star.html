<!-- Form POST ini memakai CSRF token untuk mengubah status star proyek. -->
<form method="post" action="{% url 'main:toggle_star' project.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit" class="button button-star"
        title="{% if user in project.starred_by.all %}Batalkan star{% else %}Beri star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in project.starred_by.all %}
        Unstar
        {% else %}
        Star
        {% endif %}
        <span class="star-count">{{ project.starred_by.count }}</span>
    </button>
</form>
